# CI: typecheck + unit tests on every PR and on the two long-lived branches.
# The suite is network-free by design (providers are stubbed in tests); no
# provider key is ever configured here — a test that starts requiring one
# should fail loudly in CI rather than silently consume credits.
name: CI

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version pinned by package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Import-boundary guard (invariant I2, audit CH-06): the kernel must not
      # import the wire surface. Runs before typecheck because it is the
      # cheapest check in the job — node stdlib, no network — and a boundary
      # break is worth failing on immediately.
      - run: pnpm run check:boundaries
      - run: pnpm run typecheck
      # llm.config.json is gitignored (per-user); a few E2E tests load it.
      # Same step as the documented install: copy the example profile.
      - run: cp llm.config.example.json llm.config.json
      - run: pnpm test
